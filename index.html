<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geometry Bullets</title>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="fps"></div>
    <div id="score-container">
      <span id="high-score"></span>
      <span id="score"></span>
      <span id="difficulty"></span>
    </div>
    <div id="pause-menu" class="menu-container" style="display: none">
      <div class="menu-content">
        <div class="menu-title">Paused</div>
        <button id="resume-button" class="menu-button">Resume</button>
      </div>
    </div>
    <div id="menu" class="menu-container">
      <div class="menu-content">
        <div class="menu-title">Geometry Bullets</div>
        <div id="menu-buttons">
          <button id="play-button" class="menu-button">Play</button>
          <button id="how-to-play-button" class="menu-button">
            How to play
          </button>
          <button id="settings-button" class="menu-button">Settings</button>
          <button id="credits-button" class="menu-button">Credits</button>
        </div>
        <div class="text-container" id="credits" style="display: none">
          Made by <a href="https://onassis.dev" target="_blank">Onassis</a>, You
          can see how
          <a
            href="https://onassis.dev/blog/geometry_bullets_a_small_game"
            target="_blank"
            >Here</a
          >. Also, you can see the code in the
          <a
            href="https://github.com/Onassis-dev/geometry_bullets"
            target="_blank"
            >Repo</a
          >.
        </div>
        <div id="settings" style="display: none">
          <div id="difficulty-buttons">
            <button id="normal-button" class="menu-button">Normal</button>
            <button id="hard-button" class="menu-button">Hard</button>
            <button id="fast-button" class="menu-button">Fast</button>
          </div>
        </div>
        <div class="text-container" id="how-to-play" style="display: none">
          <p>Use WASD to move, move your mouse to aim and click to shoot.</p>
          <p>Press SPACE to teleport yourself to where your cursor is.</p>
          <p>Press ESC to pause the game.</p>
        </div>
        <div id="menu-footer">
          <button id="back-button" class="menu-button" style="display: none">
            Back
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/index.js"></script>
    <link rel="stylesheet" href="/src/index.css" />
  </body>
</html>
